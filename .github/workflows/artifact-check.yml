name: Artifact checks

# 随仓库分发的样本必须真的可用——不只是"工具能跑"。
# pipeline-check 跑的是合成素材上的回归；这里跑的是 **examples/ 里的真实样本**，
# 保证 clone 下来照着 walkthrough 走一遍不会撞墙。

on:
  push:
    branches: [main, master]
    paths:
      - 'examples/**'
      - 'templates/**'
      - 'scripts/tdlib/validate.py'
      - 'scripts/tdlib/evals.py'
      - 'scripts/tdlib/fidelity.py'
      - '.github/workflows/artifact-check.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifacts:
    name: 随包样本可核验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 样本技能包静态校验 0 error
        run: |
          out=$(python scripts/td.py validate examples/sample-bundle)
          echo "$out"
          echo "$out" | grep -q "error 0" || { echo "::error::样本未通过静态校验"; exit 1; }

      # 样本报告只有 1 个独立评分者（fidelity-grader）。gate 默认要求交叉复核，
      # 所以这里显式 --allow-single-scorer：**诚实豁免**，不是绕过——样本就一份评分，
      # 我们不假装它做过交叉复核。真实的双评分工流见 eval-kit。
      - name: FIDELITY 门禁（样本报告，单评分显式豁免）
        run: python scripts/td.py gate examples/sample-bundle/eval/fidelity-report.md --allow-single-scorer

      # 关键：verify-quotes 对**空集**也会输出「✅ 全部引语核到」（0 引用 → 0 核验 → pass）。
      # 这种假绿比报错更危险，所以这里必须用 fixture 断言 verified > 0，而不是只看退出码。
      - name: 引语核验非空集（防空集假绿）
        run: |
          mkdir -p /tmp/fx
          cat > /tmp/fx/corpus.md <<'EOF'
          【第1条 | 2026-01-01 | a1】製造難度是最難的問題，這一點遠超其他因素。
          【第2条 | 2026-01-02 | a2】如果不确定，就明确说不确定。
          EOF
          cat > /tmp/fx/card.md <<'EOF'
          ---
          name: fx
          description: |
            测试用卡片，描述足够长以通过长度检查。
          ---

          # FX

          【第1条】「製造難度是最難的問題」

          【第2条】「如果不确定，就明确说不确定。」
          EOF
          python scripts/td.py verify-quotes /tmp/fx/card.md /tmp/fx/corpus.md --out /tmp/fx/q.json
          python - <<'PY'
          import json, sys
          d = json.load(open("/tmp/fx/q.json"))
          print(f"quotes_checked={d['quotes_checked']} verified={d['verified']} verdict={d['verdict']}")
          if d["quotes_checked"] < 1:
              print("::error::核验到 0 条引语——空集也会判 pass，这不是通过")
              sys.exit(1)
          if d["verified"] != d["quotes_checked"]:
              print("::error::存在核不到的引语")
              sys.exit(1)
          PY

      # 真实书类卡：书类引用块型引语（带出处信号 `—— 《…》` / `—— 同上`）也必须能核到。
      # 这是新加的书类引用块路径（报告 P1-1），合成 fixture 只覆盖了条目/时间戳定位，
      # 覆盖不到「引用块 + 出处信号」这种书类专属排版，所以这里用真实样本补上。
      - name: 书类引用块核验（真实样本 five-affairs）
        run: |
          python scripts/td.py verify-quotes \
            examples/sample-bundle/skills/five-affairs-seven-questions/SKILL.md \
            examples/sample-bundle/sources/sunzi-ji.txt --out /tmp/book.json
          python - <<'PY'
          import json, sys
          d = json.load(open("/tmp/book.json"))
          print(f"quotes_checked={d['quotes_checked']} verified={d['verified']} "
                f"book_block={d['book_block']} verdict={d['verdict']}")
          if d["book_block"]["checked"] < 1:
              print("::error::书类引用块路径未核验到任何引语")
              sys.exit(1)
          if d["verified"] != d["quotes_checked"]:
              print("::error::存在核不到的引语")
              sys.exit(1)
          PY

      # 引语体检：样例卡不得有简繁/异体**用字不一致**（glyph 判失败）。
      # 提示级（省略号 / 归属可疑）不判失败——CI 只看硬失败，避免启发式噪声卡 CI。
      - name: 引语体检（lint-quotes，样例卡无用字不一致）
        run: |
          python scripts/td.py lint-quotes \
            examples/sample-bundle/skills/five-affairs-seven-questions/SKILL.md \
            --corpus examples/sample-bundle/sources/sunzi-ji.txt

      # 端到端：样本语料能真的蒸出东西（chunk → lexindex → 查询）
      - name: 蒸馏链路冒烟
        run: |
          python scripts/td.py chunk examples/sample-bundle/sources/sunzi-ji.txt
          python scripts/td.py lexindex examples/sample-bundle/sources/sunzi-ji.txt.td/chunks.jsonl
          python scripts/td.py lexindex --db examples/sample-bundle/sources/sunzi-ji.txt.td/lexical.sqlite --query "道" --limit 3
