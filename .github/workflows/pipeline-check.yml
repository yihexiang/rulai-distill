name: pipeline-check

# rulai-distill 回归网。vendored 上游代码随之同步，测试必须仍全绿。
on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    name: e2e (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 是 SKILL.md 声明的最低版本；3.13 是本机开发版本
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 契约产物本身要能被解析：校验 13 个上游 schema + 4 个本包 schema 是合法 JSON
      - name: 校验内置 Schema
        run: |
          python - <<'PY'
          import glob, json
          files = sorted(glob.glob('schemas/*.json') + glob.glob('scripts/vendor/cangjie/schemas/**/*.json', recursive=True))
          for f in files:
              json.load(open(f, encoding='utf-8'))
          print(f'{len(files)} 个 schema 合法')
          PY

      # 零依赖模式：不装 pyyaml / tiktoken，验证降级路径仍然可用
      - name: 回归测试（零依赖模式）
        run: python tests/e2e.py

      # 完整依赖模式：验证 tiktoken 计量与 PyYAML 严格解析路径
      - name: 安装可选依赖
        run: python -m pip install --quiet --disable-pip-version-check pyyaml tiktoken
      - name: 回归测试（含 pyyaml/tiktoken）
        run: python tests/e2e.py --tiktoken

      # 技能包自校验：0 error
      - name: 技能包静态校验
        run: python scripts/td.py validate .

      # vendored 上游脚本必须仍然可运行（契约没有被改坏）
      - name: vendored 上游体检
        run: |
          python scripts/td.py upstream list
          python scripts/td.py upstream run --dry-run chunk --help

  safety:
    name: 红线扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # 本包承诺零网络、零动态执行；这里做机器校验，避免将来被无意破坏。
      # 红线用 \b 词边界，避免误伤良性标识符（cmd_output_eval / evals.output_eval）。
      # 再用 grep -v 排除剩余的良性命中：output_eval 是「结果输出」不是「动态执行」；
      # 设计原则 docstring（第 9 行）里描述性地写到 shell=True，不是真实调用。
      - name: 禁止危险调用模式
        run: |
          ! grep -rnE "\beval\(|\bexec\(|os\.system|shell=True|socket\.|requests\.|urllib\.request|httpx|aiohttp" \
               scripts/td.py scripts/tdlib/ \
               --include='*.py' | grep -v -e "output_eval" -e "subprocess(shell=True)"
      - name: 禁止硬编码密钥
        # 2026-10-15 修（缺陷 #85）：原正则 `api[_-]?key\s*=\s*['"]` 会命中
        # `line.startswith("DEEPSEEK_API_KEY=")` —— 那是在**解析 env 文件名**，
        # 等号后面没有任何值，根本不是硬编码密钥。CI 因此连续两轮推送假红。
        # 修法：要求引号内**有值**且长度 ≥8，把"赋值给空串/纯键名"排除在外；
        # 真密钥（sk-…、长随机串）仍然被抓。这不是放水，是把尺子校准。
        # 同一口径已搬进 tests/e2e.py 的 t_no_hardcoded_secrets，
        # 本地绿与 CI 绿从此一致（含负向探针：真密钥必须仍被命中）。
        run: |
          ! grep -rniE "api[_-]?key\s*=\s*['\"][^'\"]{8,}['\"]|secret\s*=\s*['\"][^'\"]{8,}['\"]|password\s*=\s*['\"][^'\"]{8,}['\"]|Bearer [A-Za-z0-9]{20}" \
               scripts/ --include='*.py' --include='*.sh'
