name: Docs freshness

# 文档防腐烂。
#
# 2026-10-05 实测三处漂移，且**没有任何测试能抓到**：
#   1. CONSTRAINTS.md 写「迄今 30 个缺陷」「11 个已知缺陷」，实际台账 42 条；
#   2. CAPABILITIES.md 写「46 项回归」，实际 58 项；
#   3. CONSTRAINTS.md 的「机制说明」整节重复了两遍。
# 根因：文档里的数字是人手写的，代码变了文档不会跟着变。
# 对策：把文档里的断言抽成测试（t_docs_no_drift / t_defect_ledger_stats），
#       这里只负责在 .md 变更时快速触发——逻辑只在测试里写一份，不在这里重写。

on:
  push:
    branches: [main, master]
    paths:
      - '**/*.md'
      - '.github/workflows/docs-check.yml'
  pull_request:
    paths:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    name: 文档数字与代码一致
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 文档不漂移 / 台账数字不腐烂
        run: python tests/e2e.py --only t_docs_no_drift,t_defect_ledger_stats

      - name: 缺陷台账每条都有回归测试
        run: python tests/e2e.py --only t_defect_regression_ledger

      - name: 约束表无静默缺口
        run: python tests/e2e.py --only t_contract_ledger_no_silent_gap

      # P0-4：对外声称台账。README 里每个数字都要能指到真实存在的证据
      # （测试名 / 可复跑命令），且回归项数与仓库实际一致。
      # 这不是"再写一份检查"——它挡住的是本项目最高频的病：声称 ≠ 实际
      # （曾写「12 张卡」实际 9 张、「2 张卡跑过交叉复核」实际 6 张，都没人红）。
      - name: 对外声称有据且数字不腐烂
        run: python docs/verify_claims.py

      # Markdown 结构自检：死链与重复章节（纯文本层，无需构建）
      # #64（2026-10-10）：这段逻辑原先内联在本文件里 → **本地回归跑不到它**，
      # 于是「本地 96 项全绿、CI 两处红」成为可能。现已搬进 tests/doc_structure_check.py
      # 并接入 tests/e2e.py（t_self_validate_clean_and_doc_structure），这里只调用。
      - name: Markdown 结构自检
        run: python tests/doc_structure_check.py
